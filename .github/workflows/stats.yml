name: Generate Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    name: Render stats SVG from GitHub API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ChristianGrimberg
        run: |
          mkdir -p generated
          python3 - <<'PY'
          import os, json, urllib.request, datetime, html
          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          def gh(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "profile-stats-action",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          user_data = gh(f"/users/{user}")
          repos = []
          page = 1
          while True:
              batch = gh(f"/users/{user}/repos?per_page=100&page={page}&type=owner&sort=pushed")
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          # Aggregate
          total_stars = sum(r.get("stargazers_count", 0) for r in repos)
          total_forks = sum(r.get("forks_count", 0) for r in repos)
          followers = user_data.get("followers", 0)
          public_repos = user_data.get("public_repos", 0)

          lang_count = {}
          for r in repos:
              if r.get("fork"):
                  continue
              lang = r.get("language")
              if lang:
                  lang_count[lang] = lang_count.get(lang, 0) + 1
          top_langs = sorted(lang_count.items(), key=lambda x: -x[1])[:6]

          # SVG palette (tokyonight-inspired)
          BG = "#1a1b27"
          FG = "#c0caf5"
          ACCENT = "#7aa2f7"
          MUTED = "#565f89"

          def card(title, items, width=460):
              line_h = 22
              height = 50 + len(items) * line_h
              parts = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}" font-family="Segoe UI, Helvetica, Arial, sans-serif">',
                  f'<rect width="{width}" height="{height}" fill="{BG}" rx="8"/>',
                  f'<text x="16" y="30" fill="{ACCENT}" font-size="16" font-weight="600">{html.escape(title)}</text>',
              ]
              for i, (k, v) in enumerate(items):
                  y = 30 + line_h + i * line_h
                  parts.append(
                      f'<text x="16" y="{y}" fill="{FG}" font-size="14">{html.escape(str(k))}</text>'
                      f'<text x="{width-16}" y="{y}" fill="{ACCENT}" font-size="14" '
                      f'text-anchor="end" font-weight="600">{html.escape(str(v))}</text>'
                  )
              parts.append("</svg>")
              return "\n".join(parts)

          overview_items = [
              ("Public repos", public_repos),
              ("Followers", followers),
              ("Stars received", total_stars),
              ("Forks received", total_forks),
              ("Profile updated", user_data.get("updated_at", "")[:10]),
          ]
          with open("generated/stats.svg", "w") as f:
              f.write(card("GitHub Stats", overview_items))

          lang_items = [(name, count) for name, count in top_langs]
          with open("generated/languages.svg", "w") as f:
              f.write(card("Top Languages", lang_items, width=460))

          print(f"Wrote stats.svg and languages.svg ({len(repos)} repos processed)")
          PY

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate stats SVG [skip ci]"
            git push
          fi
